# Project Metadata
project.group=io.github.rlce
project.description=Kotlin Multiplatform localization library using KSP
project.url=https://github.com/rlce/kloca
project.vcs.url=https://github.com/rlce/kloca.git
project.vcs.connection=scm:git:git://github.com/rlce/kloca.git
project.vcs.developerConnection=scm:git:ssh://github.com:rlce/kloca.git

# Maven Artifact Versions
kloca.gradle.plugin.version=0.2.0
kloca.runtime.version=0.2.0
kloca.runtime.compose.version=0.2.0

# Maven Artifact Names
kloca.gradle.plugin.name=Kloca Gradle Plugin
kloca.runtime.name=Kloca Runtime
kloca.runtime.compose.name=Kloca Runtime Compose
kloca.gradle.plugin.description=Gradle plugin for Kotlin Multiplatform localization using KSP
kloca.runtime.description=Runtime components for Kotlin Multiplatform localization
kloca.runtime.compose.description=Compose integration components for Kotlin Multiplatform localization

# License Information
project.license.name=MIT
project.license.url=https://opensource.org/licenses/MIT

# Developer Information
project.developer.id=rlce
project.developer.name=RLCE
project.developer.email=dev@rlce.com

# Gradle Configuration
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.caching=true
org.gradle.parallel=true
org.gradle.configuration-cache=false

# Kotlin Configuration
kotlin.version=2.2.20
kotlin.code.style=official
kotlin.mpp.androidSourceSetLayoutVersion=2
kotlin.incremental=true
kotlin.incremental.multiplatform=true
kotlin.native.ignoreDisabledTargets=true

# Android Configuration
android.useAndroidX=true
android.nonTransitiveRClass=true
android.enableJetifier=true

# Enable publishing to Maven Central
org.gradle.configureondemand=false
