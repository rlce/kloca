name: Publish

on:
  release:
    types: [released, prereleased]
  workflow_dispatch:
    inputs:
      publish_runtime:
        description: 'Publish runtime libraries to Maven Central'
        required: false
        default: 'true'
        type: boolean
      publish_plugin:
        description: 'Publish Gradle plugin to Maven Central'
        required: false
        default: 'true'
        type: boolean

jobs:
  publish:
    name: Release build and publish
    runs-on: macOS-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: 17

      - name: Setup Gradle
        uses: gradle/gradle-build-action@v3
        with:
          gradle-home-cache-cleanup: true

      - name: Validate Gradle wrapper
        uses: gradle/wrapper-validation-action@v2

      - name: Run tests
        run: ./gradlew test

      - name: Publish runtime libraries to Maven Central
        if: (github.event_name == 'release' || inputs.publish_runtime == true)
        run: |
          echo "Publishing kloca-runtime..."
          ./gradlew :kloca-runtime:publishToMavenCentral --no-configuration-cache

          echo "Publishing kloca-runtime-compose..."
          ./gradlew :kloca-runtime-compose:publishToMavenCentral --no-configuration-cache
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.GPG_KEY_CONTENTS }}

      - name: Publish Gradle plugin to Maven Central
        if: github.event_name == 'release' || inputs.publish_plugin == true
        run: ./gradlew :kloca-gradle-plugin:publishToMavenCentral --no-configuration-cache
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.GPG_KEY_CONTENTS }}